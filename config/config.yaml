data_ingestion:
  kaggle_dataset: "paultimothymooney/chest-xray-pneumonia"
  raw_data_dir: "data/raw"
  # actual dataset unzips into a nested chest_xray/chest_xray folder on Kaggle —
  # ingestion resolves this automatically, see data_ingestion.py
  extracted_folder_name: "chest_xray"
  processed_data_dir: "data/processed"
  class_names:
    - "NORMAL"
    - "PNEUMONIA"
  val_split_ratio: 0.15
  random_seed: 42

image_preprocessing:
  img_size: 224
  batch_size: 32
  num_workers: 2
  normalize_mean: [0.485, 0.456, 0.406]   # ImageNet stats — needed since we replicate
  normalize_std: [0.229, 0.224, 0.225]    # grayscale to 3-channel for the ResNet backbone
  use_weighted_sampler: true
  augmentation:
    random_rotation_degrees: 10
    horizontal_flip_prob: 0.5
    color_jitter_brightness: 0.1
    color_jitter_contrast: 0.1

model_training:
  model_type: "resnet18"          # "resnet18" or "baseline_cnn"
  num_classes: 2
  checkpoint_dir: "models"

  # used when model_type is "resnet18"
  resnet:
    freeze_backbone_epochs: 8
    freeze_backbone_lr: 0.001
    finetune_epochs: 5
    finetune_lr: 0.00001

  # used when model_type is "baseline_cnn"
  baseline_cnn:
    num_epochs: 10
    learning_rate: 0.001

  weight_decay: 0.0001
  early_stopping_patience: 3      # stop if val_loss doesn't improve for N epochs
  lr_scheduler_patience: 2
  lr_scheduler_factor: 0.5
  random_seed: 42